apiVersion: v1
kind: Namespace
metadata:
  name: odoo
---
apiVersion: v1
kind: Secret
metadata:
  name: odoo-db-secret
  namespace: odoo
type: Opaque
stringData:
  db_password: "xxxxxxxx"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-data-pvc
  namespace: odoo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
    spec:
      securityContext:
        fsGroup: 101

      initContainers:
        - name: init-odoo-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/odoo/sessions
              chown -R 100:101 /var/lib/odoo
              chmod -R 755 /var/lib/odoo
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: odoo-data
              mountPath: /var/lib/odoo

      containers:
        - name: odoo
          image: odoo:18
          ports:
            - containerPort: 8069
          env:
            - name: HOST
              value: "postgresql.postgresql.svc.cluster.local"
            - name: PORT
              value: "5432"
            - name: USER
              value: "odoo"
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-db-secret
                  key: db_password
          volumeMounts:
            - name: odoo-data
              mountPath: /var/lib/odoo

      volumes:
        - name: odoo-data
          persistentVolumeClaim:
            claimName: odoo-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: odoo
spec:
  selector:
    app: odoo
  ports:
    - port: 8069
      targetPort: 8069
  type: ClusterIP
